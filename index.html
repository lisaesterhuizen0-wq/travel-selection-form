    /* ============================================================
       Field Notes v2 — locked design system
       Reskin only: colours / type / borders. No logic touched.
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --paper: #F9FBFC;        /* cool blue-white page background */
      --ink: #1C2B3A;          /* blue-black pen ink — primary text/borders */
      --ink-soft: rgba(28, 43, 58, 0.64);  /* secondary text */
      --ink-faint: rgba(28, 43, 58, 0.40); /* tertiary/labels */
      --ochre: #0E7C66;        /* viridian — cold lab green accent */
      --ochre-deep: #095A4A;   /* darker viridian — hovers, dates */
      --rule: rgba(28, 43, 58, 0.24);      /* hairline rules */
      --rule-soft: rgba(28, 43, 58, 0.10); /* faint rules, shadows */
      --grid: rgba(43, 76, 126, 0.07);     /* blue quad-paper grid lines */
      --card: #FFFFFF;         /* raised surfaces / cards */
      --blue: #0B6EFF;         /* bright terminal blue — labels, meta */
    }

    body {
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--ink);
      font-family: "Public Sans", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 28px 120px;
    }

    /* ---- Boxed masthead ---- */
    header {
      text-align: left;
      margin-bottom: 48px;
      padding: 32px 32px 28px;
      background: var(--card);
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--rule-soft);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "§ TRAVEL SELECTION LOG";
      display: block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--blue);
      margin-bottom: 14px;
    }

    h1 {
      font-family: "Newsreader", serif;
      font-size: clamp(2rem, 5vw, 2.9rem);
      font-weight: 500;
      line-height: 1.1;
      margin-bottom: 10px;
      letter-spacing: 0;
      color: var(--ink);
    }

    h1 em { font-style: normal; }

    .subtitle {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-soft);
      font-weight: 400;
    }

    /* ---- Progress ---- */
    .progress-container {
      background: var(--card);
      padding: 22px 24px;
      border: 1px solid var(--rule);
      border-radius: 0;
      margin-bottom: 44px;
      box-shadow: 4px 4px 0 var(--rule-soft);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .progress-text {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
    }

    .progress-count {
      font-weight: 500;
      color: var(--ochre);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--rule-soft);
      border-radius: 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--ochre);
      border-radius: 0;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ---- Sections ---- */
    .section {
      margin-bottom: 48px;
      animation: fadeIn 0.6s ease-out;
      animation-fill-mode: both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section:nth-child(1) { animation-delay: 0.1s; }
    .section:nth-child(2) { animation-delay: 0.2s; }
    .section:nth-child(3) { animation-delay: 0.3s; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--ink);
    }

    .section-icon {
      font-size: 1.4rem;
    }

    h2 {
      font-family: "Newsreader", serif;
      font-size: 1.75rem;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0;
    }

    .subsection {
      margin-bottom: 32px;
    }

    .subsection-title {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-soft);
      margin-bottom: 16px;
      padding-left: 0;
    }

    .subsection-title::before {
      content: "§ ";
      color: var(--ink-faint);
    }

    .options-grid {
      display: grid;
      gap: 12px;
    }

    /* ---- Option cards ---- */
    .option-card {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 0;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .option-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: var(--ochre);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .option-card:hover {
      border-color: var(--ink);
      box-shadow: 4px 4px 0 var(--rule-soft);
    }

    .option-card.selected {
      border-color: var(--ochre);
      background: var(--card);
    }

    .option-card.selected::before {
      transform: scaleY(1);
    }

    .option-card.recommended {
      border-color: var(--rule);
    }

    .option-card.recommended::after {
      content: 'RECOMMENDED';
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      color: var(--ochre-deep);
      border: 1px solid var(--ochre-deep);
      padding: 3px 10px;
      border-radius: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .option-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .radio-button {
      width: 18px;
      height: 18px;
      border: 1px solid var(--rule);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
      position: relative;
      transition: all 0.2s;
    }

    .option-card:hover .radio-button {
      border-color: var(--ink);
    }

    .option-card.selected .radio-button {
      border-color: var(--ochre);
      background: var(--ochre);
    }

    .option-card.selected .radio-button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 7px;
      height: 7px;
      background: var(--card);
      border-radius: 50%;
    }

    .option-content {
      flex: 1;
    }

    .option-title {
      font-family: "Newsreader", serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .option-details {
      font-size: 0.92rem;
      color: var(--ink-soft);
      line-height: 1.55;
      margin-bottom: 8px;
    }

    .option-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-soft);
    }

    .price {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      color: var(--ochre);
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    /* ---- Bottom bar ---- */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--ink);
      padding: 20px;
      box-shadow: 0 -4px 16px var(--rule-soft);
      z-index: 100;
    }

    .bottom-bar-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ---- Buttons: mono uppercase ---- */
    .btn {
      padding: 14px 28px;
      border-radius: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid var(--ink);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--ink);
      color: var(--paper);
      flex: 1;
      min-width: 200px;
      justify-content: center;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--ochre-deep);
      border-color: var(--ochre-deep);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--ink);
      color: var(--ink);
    }

    .btn-secondary:hover {
      border-color: var(--ochre-deep);
      color: var(--ochre-deep);
    }

    .validation-message {
      flex: 1;
      font-family: "IBM Plex Mono", monospace;
      color: var(--ink-soft);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-left: 12px;
    }

    /* ---- Modal ---- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(28, 43, 58, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
      padding: 20px;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--ink);
      border-radius: 0;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 6px 6px 0 var(--rule-soft);
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-icon {
      font-size: 2.6rem;
      text-align: center;
      margin-bottom: 20px;
    }

    .modal h3 {
      font-family: "Newsreader", serif;
      font-size: 1.75rem;
      font-weight: 500;
      text-align: center;
      margin-bottom: 16px;
      color: var(--ink);
    }

    .modal p {
      text-align: center;
      color: var(--ink-soft);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .container {
        padding: 32px 16px 140px;
      }

      header {
        padding: 24px 20px;
        margin-bottom: 40px;
      }

      h1 {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 0.78rem;
      }

      .bottom-bar-content {
        flex-direction: column;
      }

      .btn-primary {
        width: 100%;
      }

      .validation-message {
        text-align: center;
        padding-left: 0;
      }

      .modal {
        padding: 30px 20px;
      }

      .modal-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

    function App() {
      const [selections, setSelections] = useState({});
      const [sending, setSending] = useState(false);
      const [showSuccess, setShowSuccess] = useState(false);

      // Load from localStorage on mount
      useEffect(() => {
        const saved = localStorage.getItem('tripSelections');
        if (saved) {
          try {
            setSelections(JSON.parse(saved));
          } catch (e) {
            console.error('Failed to load saved selections:', e);
          }
        } else {
          // Pre-select recommended options
          const defaultSelections = {};
          tripConfig.sections.forEach(section => {
            section.items.forEach(item => {
              const recommended = item.options.find(opt => opt.recommended);
              if (recommended) {
                defaultSelections[item.id] = recommended.id;
              }
            });
          });
          setSelections(defaultSelections);
        }
      }, []);

      // Save to localStorage whenever selections change
      useEffect(() => {
        localStorage.setItem('tripSelections', JSON.stringify(selections));
      }, [selections]);

      const handleSelect = (itemId, optionId) => {
        setSelections(prev => ({ ...prev, [itemId]: optionId }));
      };

      const getTotalItems = () => {
        return tripConfig.sections.reduce((acc, section) => 
          acc + section.items.length, 0
        );
      };

      const getCompletedItems = () => {
        return Object.keys(selections).length;
      };

      const isComplete = () => {
        return getCompletedItems() === getTotalItems();
      };

      const generateSummary = () => {
        let summary = `Hi Lisa,\n\nHere are my selections for the October 1-7 trip:\n\n`;
        
        tripConfig.sections.forEach(section => {
          summary += `${section.title.toUpperCase()}:\n`;
          section.items.forEach(item => {
            const selectedId = selections[item.id];
            const option = item.options.find(opt => opt.id === selectedId);
            if (option) {
              summary += `• ${item.label}: ${option.title}\n`;
            }
          });
          summary += `\n`;
        });
        
        summary += `Please proceed with booking.\n\nThanks,\n[Your Name]`;
        return summary;
      };

      const sendEmail = () => {
        const subject = encodeURIComponent('Trip Selections: October 1-7');
        const body = encodeURIComponent(generateSummary());
        window.location.href = `mailto:assistant@example.com?subject=${subject}&body=${body}`;
        
        // Show success message
        setTimeout(() => setShowSuccess(true), 500);
      };

      const handleReset = () => {
        if (confirm('Clear all selections and start over?')) {
          setSelections({});
          localStorage.removeItem('tripSelections');
        }
      };

      const progress = (getCompletedItems() / getTotalItems()) * 100;

      return (
        <div className="container">
          <header>
            <h1>{tripConfig.title}</h1>
            <p className="subtitle">{tripConfig.subtitle}</p>
          </header>

          <div className="progress-container">

              <span className="progress-text">

              <span className="progress-text">{Math.round(progress)}% complete</span>
            </div>
            <div className="progress-bar">
              <div className="progress-fill" style={{ width: `${progress}%` }}></div>
            </div>
          </div>

          {tripConfig.sections.map(section => (
            <div key={section.id} className="section">
              <div className="section-header">
                <span className="section-icon">{section.icon}</span>
                <h2>{section.title}</h2>
              </div>

              {section.items.map(item => (
                <div key={item.id} className="subsection">
                  <h3 className="subsection-title">{item.label}</h3>
                  <div className="options-grid">
                    {item.options.map(option => (
                      <div
                        key={option.id}
                        className={`option-card ${selections[item.id] === option.id ? 'selected' : ''} ${option.recommended ? 'recommended' : ''}`}
                        onClick={() => handleSelect(item.id, option.id)}
                      >
                        <div className="option-header">
                          <div className="radio-button"></div>
                          <div className="option-content">
                            <div className="option-title">{option.title}</div>
                            <div className="option-details">{option.details}</div>
                            {option.note && <div className="option-details" style={{ fontStyle: 'italic', marginTop: '8px' }}>Note: {option.note}</div>}
                            <div className="option-meta">
                              <span className="price">{option.price}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          ))}

          <div className="bottom-bar">
            <div className="bottom-bar-content">
              {!isComplete() && (
                <span className="validation-message">
                  Please complete {getTotalItems() - getCompletedItems()} more selection{getTotalItems() - getCompletedItems() !== 1 ? 's' : ''}
                </span>
              )}
              
              <button
                className="btn btn-primary"
                onClick={sendEmail}
                disabled={!isComplete() || sending}
              >
                <span>📧</span>
                Email My Selections
              </button>
              
              <button
                className="btn btn-secondary"
                onClick={handleReset}
                disabled={sending}
              >
                Reset
              </button>
            </div>
          </div>

{showSuccess && (
            <div className="modal-overlay" onClick={() => setShowSuccess(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="modal-icon">📧</div>
                <h3>Email Opening...</h3>
                <p>Your email client should open with your selections pre-filled. Just click Send!</p>
                
                <div className="modal-actions">
                  <button className="btn btn-primary" onClick={() => setShowSuccess(false)}>
                    Got It
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
